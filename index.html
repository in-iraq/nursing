<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جدول خفارات الملاكات التمريضية</title>
    <style>
        :root {
            --primary-color: #0284c7;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 950px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 25px;
        }
        header h1 {
            color: var(--primary-color);
            font-size: 22px;
            margin-bottom: 8px;
        }
        .link-box {
            margin-top: 10px;
        }
        .link-box a {
            color: var(--primary-color);
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            background: #e0f2fe;
            padding: 6px 12px;
            border-radius: 6px;
            display: inline-block;
        }
        .link-box a:hover {
            background: #bae6fd;
        }
        .filter-box {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        label {
            font-weight: bold;
            font-size: 14px;
        }
        select {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            font-size: 16px;
            outline: none;
            background: #fff;
            cursor: pointer;
        }
        select:focus {
            border-color: var(--primary-color);
        }
        .table-responsive {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
        }
        th, td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
        }
        th {
            background-color: var(--primary-color);
            color: white;
            font-weight: 600;
        }
        tr:hover {
            background-color: #f1f5f9;
        }
        .loading {
            text-align: center;
            padding: 40px;
            font-size: 15px;
            color: #64748b;
        }
        .badge {
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            display: inline-block;
        }
        .badge-morning { background: #e0f2fe; color: #0369a1; }
        .badge-evening { background: #fef3c7; color: #d97706; }
        .badge-night { background: #f3e8ff; color: #7e22ce; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>جدول خفارات الملاكات التمريضية - شهر تشرين الثاني</h1>
            <p>اختر القسم أو الجناح الطبي لعرض جدول الخفارات الخاص به</p>
            <!-- تم تضمين رابط الويب أو الشيت هنا ليظهر داخل الصفحة -->
            <div class="link-box">
                <a href="https://script.google.com/macros/s/AKfycbwPQcWtk1Ylwf9C139JzSC4-Mi7Ta05PRWf8AL302tnAnkMoNzdwvNvbqgETNck2w-qHg/exec" target="_blank">🔗 رابط التطبيق الحالي المباشر</a>
            </div>
        </header>

        <div class="filter-box">
            <label for="deptSelect">اختر القسم / الجناح الطبي:</label>
            <select id="deptSelect" onchange="filterSchedule()">
                <option value="">-- جاري الاتصال بالسكريبت وجلب الأقسام --</option>
            </select>
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>التاريخ</th>
                        <th>اليوم</th>
                        <th>اسم الممرض / الممرضة</th>
                        <th>نوع الخفر</th>
                        <th>التوقيت</th>
                    </tr>
                </thead>
                <tbody id="scheduleBody">
                    <tr>
                        <td colspan="5" class="loading">يرجى اختيار القسم من القائمة أعلاه لعرض التفاصيل...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let globalData = null;

        window.onload = function() {
            google.script.run
                .withSuccessHandler(onDataLoaded)
                .withFailureHandler(onDataError)
                .getDepartmentsData();
        };

        function onDataLoaded(data) {
            globalData = data;
            const select = document.getElementById('deptSelect');
            select.innerHTML = '<option value="">-- اضغط للاختيار --</option>';
            
            if (data && data.departments && data.departments.length > 0) {
                data.departments.forEach(dept => {
                    let opt = document.createElement('option');
                    opt.value = dept;
                    opt.textContent = dept;
                    select.appendChild(opt);
                });
            } else {
                select.innerHTML = '<option value="">لا توجد أقسام متاحة</option>';
            }
        }

        function onDataError(error) {
            const select = document.getElementById('deptSelect');
            select.innerHTML = '<option value="">خطأ في الاتصال بقاعدة البيانات</option>';
            console.error(error);
        }

        function filterSchedule() {
            const selectedDept = document.getElementById('deptSelect').value;
            const tbody = document.getElementById('scheduleBody');
            
            if (!selectedDept) {
                tbody.innerHTML = '<tr><td colspan="5" class="loading">يرجى اختيار القسم لعرض التفاصيل...</td></tr>';
                return;
            }

            const filtered = globalData.schedule.filter(item => item.department === selectedDept);
            
            if (filtered.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="loading">لا توجد بيانات مسجلة لهذا القسم.</td></tr>';
                return;
            }

            let html = '';
            filtered.forEach(row => {
                let badgeClass = '';
                const shift = row.shiftType || '';
                if (shift.includes('صباحي')) badgeClass = 'badge-morning';
                else if (shift.includes('مسائي')) badgeClass = 'badge-evening';
                else badgeClass = 'badge-night';

                html += `<tr>
                    <td>${row.date || ''}</td>
                    <td>${row.day || ''}</td>
                    <td><strong>${row.name || ''}</strong></td>
                    <td><span class="badge ${badgeClass}">${shift}</span></td>
                    <td>${row.time || ''}</td>
                </tr>`;
            });
            tbody.innerHTML = html;
        }
    </script>
</body>
</html>
