<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة خفارات ملاكات التمريض</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --secondary: #3b82f6;
            --bg-color: #f8fafc;
            --text-color: #1e293b;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        header h1 {
            color: var(--primary);
            margin-bottom: 10px;
        }
        .select-box {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        label {
            font-weight: bold;
            color: var(--primary);
        }
        select {
            padding: 12px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }
        select:focus {
            border-color: var(--secondary);
        }
        .schedule-card {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            overflow: hidden;
            animation: fadeIn 0.4s ease-in-out;
        }
        .card-header {
            background: var(--primary);
            color: white;
            padding: 15px 20px;
            font-size: 18px;
            font-weight: bold;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
        }
        th, td {
            padding: 14px 20px;
            border-bottom: 1px solid var(--border-color);
        }
        th {
            background-color: #f1f5f9;
            color: var(--primary);
        }
        tr:hover {
            background-color: #f8fafc;
        }
        .loading {
            text-align: center;
            padding: 40px;
            font-size: 18px;
            color: #64748b;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>نظام خفارات ملاكات التمريض</h1>
        <p>اختر القسم لعرض جدول الخفارات الخاص لشهر تشرين الثاني</p>
    </header>

    <div class="select-box">
        <label for="departmentSelect">اختر القسم / الطابق:</label>
        <select id="departmentSelect" onchange="filterSchedule()">
            <option value="">-- اضغط للاختيار --</option>
        </select>
    </div>

    <div id="resultArea">
        <div class="loading">الرجاء اختيار القسم لعرض التفاصيل...</div>
    </div>
</div>

<script>
    let allData = [];
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzkGxAfWiSzWLJNWF06ddpXssOExhgqnVSluoVW3g6YdcwWJ9z1BbaHkp6Bv2A__0Cmzg/exec"; // ضع رابط السكربت هنا

    async function fetchData() {
        try {
            let response = await fetch(SCRIPT_URL);
            allData = await response.json();
            populateDropdown();
        } catch (error) {
            document.getElementById('resultArea').innerHTML = '<div class="loading" style="color: red;">تعذر الاتصال بقاعدة البيانات. تأكد من صحة الرابط.</div>';
        }
    }

    function populateDropdown() {
        const departments = [...new Set(allData.map(item => item.department))].filter(Boolean);
        const select = document.getElementById('departmentSelect');
        
        departments.forEach(dept => {
            let option = document.createElement('option');
            option.value = dept;
            option.textContent = `جدول خفارات - ${dept}`;
            select.appendChild(option);
        });
    }

    function filterSchedule() {
        const selectedDept = document.getElementById('departmentSelect').value;
        const resultArea = document.getElementById('resultArea');

        if (!selectedDept) {
            resultArea.innerHTML = '<div class="loading">الرجاء اختيار القسم لعرض التفاصيل...</div>';
            return;
        }

        const filtered = allData.filter(item => item.department === selectedDept);

        let html = `
            <div class="schedule-card">
                <div class="card-header">جدول خفارات - ${selectedDept}</div>
                <table>
                    <thead>
                        <tr>
                            <th>الفترة التاريخية</th>
                            <th>الأسماء</th>
                            <th>نوع الخفر</th>
                        </tr>
                    </thead>
                    <tbody>
        `;

        filtered.forEach(row => {
            html += `
                <tr>
                    <td><strong>${row.period}</strong></td>
                    <td style="white-space: pre-line;">${row.names}</td>
                    <td><span style="padding: 4px 10px; border-radius: 20px; font-size: 12px; background: ${row.type.includes('صباحي') ? '#dbeafe' : '#fef3c7'}; color: ${row.type.includes('صباحي') ? '#1e40af' : '#92400e'};">${row.type}</span></td>
                </tr>
            `;
        });

        html += `
                    </tbody>
                </table>
            </div>
        `;

        resultArea.innerHTML = html;
    }

    // جلب البيانات عند تحميل الصفحة
    fetchData();
</script>

</body>
</html>
